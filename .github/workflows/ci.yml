name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/finance_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/finance_tracker_test
      JWT_SECRET_KEY: ci-only-secret-never-used-for-anything-real-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies from the lockfile
        run: |
          pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
      - name: Lint and types
        run: |
          ruff check .
          mypy app
      # The same thing `make test` does locally: migrate first, then pytest.
      - name: Migrate the test database
        run: alembic upgrade head
      - name: Tests
        run: pytest -q
      - name: Known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
