[tool.poetry]
name = "finance-tracker-backend"
version = "0.1.0"
description = "Personal finance tracker API — expense tracking, budgeting, portfolio tracking"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.143.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = "^2.1.4"
alembic = "^1.20.0"
psycopg = {extras = ["binary"], version = "^3.3.6"}
pydantic = {extras = ["email"], version = "^2.14.0"}
pydantic-settings = "^2.15.0"
bcrypt = "^5.0.0"
httpx = "^0.28.1"
python-multipart = "^0.0.32"  # required by FastAPI for UploadFile / form parsing
pyjwt = "^2.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.16.10"
mypy = "^2.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 wants `(str, Enum)` -> StrEnum. Not a free rewrite: str() of a member
# differs between the two, and these enums feed schemas, queries and stored
# values. Do it as its own audited change, not as a side effect of a ruff bump.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own DI pattern is `= Depends(...)` / `= Query(...)` in a
# signature default — that's how the framework is meant to be used, not the
# mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
