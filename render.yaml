# Render Blueprint: the API only (free web service, Docker, Frankfurt).
#
# The database is Neon, the frontend is Vercel, and deploys are driven by the
# `Deploy` GitHub workflow (migrations first, then the Render deploy hook), so
# automatic deploys are off here. Values marked `sync: false` are asked for in
# the dashboard when the Blueprint is first applied: nothing secret lives in this
# file. Step-by-step in DEPLOY.md.
services:
  - type: web
    name: finance-tracker-api
    runtime: docker
    region: frankfurt
    plan: free # sleeps after 15 min idle (about a minute to wake); a restart empties the in-memory rate limiter
    numInstances: 1 # exactly one: rate limiter and CSV preview live in process memory
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off" # the Deploy workflow triggers it, after migrating the database
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false # Neon's DIRECT connection string (no "-pooler"); the driver prefix is fixed in Settings
      - key: JWT_SECRET_KEY
        generateValue: true
      # Nobody can register and no email is sent: accounts are made with
      # `make create-user`. To open up later see DEPLOY.md ("Turning email and
      # registration on"): that is where ADMIN_EMAIL, SMTP_* and the rest come in.
      - key: REGISTRATION_MODE
        value: closed
      # How many proxies sit in front of the app: Vercel's rewrite and Render's own.
      # Start at 2 and verify (DEPLOY.md); wrong in either direction breaks the rate limiter.
      - key: TRUSTED_PROXY_COUNT
        sync: false

# The nightly purge (`python -m app.purge`) needs a cron job, and Render's cron
# jobs have no free plan. Until then run `make purge` by hand. On a paid plan add:
#
#   - type: cron
#     name: finance-tracker-purge
#     runtime: docker
#     region: frankfurt
#     plan: starter
#     schedule: "17 3 * * *"
#     dockerfilePath: ./backend/Dockerfile.prod
#     dockerContext: ./backend
#     dockerCommand: python -m app.purge
#     envVars: # same ENVIRONMENT, DEBUG, DATABASE_URL, JWT_SECRET_KEY as the API,
#              # plus REGISTRATION_MODE=open (the purge needs no SMTP settings)
